name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Lint & Unit Test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        psversion: [ 'powershell', 'pwsh' ] # Tests both Windows PowerShell 5.1 and PS Core 7+

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer & Pester
        shell: ${{ matrix.psversion }}
        run: |
          Set-PSRepository -Name 'PSGallery' -InstallationPolicy 'Trusted'
          Install-Module -Name PSScriptAnalyzer -Force -SkipPublisherCheck -Scope CurrentUser
          Install-Module -Name Pester -Force -SkipPublisherCheck -Scope CurrentUser -MinimumVersion 5.3.0

      - name: Run PSScriptAnalyzer Linting
        shell: ${{ matrix.psversion }}
        run: |
          $results = Invoke-ScriptAnalyzer -Path ./src -Settings ./PSScriptAnalyzerSettings.psd1 -Recurse
          $results | Format-Table -AutoSize
          $errors = $results | Where-Object { $_.Severity -eq 'Error' }
          if ($errors) {
            Write-Error "PSScriptAnalyzer detected $($errors.Count) errors."
            exit 1
          }

      - name: Run Pester Unit Tests
        shell: ${{ matrix.psversion }}
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Output.Verbosity = 'Detailed'
          $config.Run.Exit = $true
          Invoke-Pester -Configuration $config
